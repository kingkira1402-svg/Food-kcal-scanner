<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CalorieLens">
<meta name="mobile-web-app-capable" content="yes">
<title>CalorieLens — Know What You Eat</title>

<script>
const manifestData = {
  name: "CalorieLens",
  short_name: "CalorieLens",
  description: "AI-powered calorie & macro tracker",
  start_url: "./",
  display: "standalone",
  background_color: "#0E0F11",
  theme_color: "#0E0F11",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%230E0F11'/><text y='130' x='20' font-size='120'>🥗</text></svg>", sizes: "192x192", type: "image/svg+xml" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const manifestURL = URL.createObjectURL(blob);
document.addEventListener('DOMContentLoaded', () => {
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = manifestURL;
  document.head.appendChild(link);
});
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════
   TOKENS
════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #0E0F11;
  --surface:  #17191D;
  --card:     #1E2025;
  --border:   #2A2D35;
  --accent:   #C6F135;
  --accent2:  #4AE3B5;
  --text:     #F2F3F5;
  --muted:    #6B7280;
  --danger:   #FF6B6B;
  --warm:     #FFA940;
  --r:        14px;
  --fd:       'Syne', sans-serif;
  --fb:       'Inter', sans-serif;
  --fm:       'DM Mono', monospace;
  /* safe-area insets for notched/island phones */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden; /* we manage scroll inside tabs */
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  -webkit-font-smoothing: antialiased;
}

/* ════════════════════════════════════════════════
   APP SHELL
════════════════════════════════════════════════ */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: -webkit-fill-available;
  padding-top: var(--sat);
}

/* ─── TOP BAR ─────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(14,15,17,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-shrink: 0;
  z-index: 50;
}
.logo { font-family: var(--fd); font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.topbar-tag {
  font-family: var(--fm); font-size: 0.65rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 20px;
}

/* ─── TAB CONTENT AREA ────────────────────────── */
.tabs-content {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.tab-panel {
  position: absolute; inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: none;
  flex-direction: column;
  padding: 16px 16px calc(16px + var(--sab));
}
.tab-panel.active { display: flex; }

/* ─── BOTTOM NAV ──────────────────────────────── */
.bottom-nav {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--sab);
  flex-shrink: 0;
  z-index: 50;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 10px 4px;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--fb);
  font-size: 0.62rem; font-weight: 500;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.nav-btn svg { transition: transform 0.15s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: scale(1.1); }
.nav-btn:active { opacity: 0.7; }

/* ════════════════════════════════════════════════
   SHARED COMPONENTS
════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.card-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.pdot { width: 7px; height: 7px; border-radius: 50%; }
.pd-r { background: var(--danger); }
.pd-y { background: var(--warm); }
.pd-g { background: var(--accent); }
.card-title { font-family: var(--fd); font-weight: 700; font-size: 0.9rem; margin-left: 2px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 12px; border: none;
  font-family: var(--fb); font-size: 0.9rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  user-select: none; -webkit-tap-highlight-color: transparent;
  /* Large enough for thumb: 48px min height */
  min-height: 48px;
}
.btn-primary { background: var(--accent); color: #0E0F11; }
.btn-primary:active { background: #d4ff3d; transform: scale(0.97); }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:active { background: var(--border); transform: scale(0.97); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-full { width: 100%; }

/* ════════════════════════════════════════════════
   TAB 1 — CAMERA
════════════════════════════════════════════════ */
/* Full-screen camera mode */
.camera-area {
  position: relative;
  background: #000;
  border-radius: var(--r);
  overflow: hidden;
  aspect-ratio: 4/3;
  width: 100%;
  display: flex; align-items: center; justify-content: center;
}
@supports not (aspect-ratio: 4/3) {
  .camera-area { height: 260px; }
}
#videoEl {
  width: 100%; height: 100%;
  object-fit: cover;
  display: none;
  border-radius: 0;
}
#canvasEl { display: none; }

.cam-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  color: var(--muted); padding: 20px;
}
.cam-icon-ring {
  width: 72px; height: 72px;
  border: 2px dashed var(--border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* Scan overlay */
.scan-overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
.sc { position: absolute; width: 26px; height: 26px; border-color: var(--accent); border-style: solid; opacity: 0.9; }
.sc.tl { top: 16px; left: 16px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.sc.tr { top: 16px; right: 16px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.sc.bl { bottom: 16px; left: 16px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.sc.br { bottom: 16px; right: 16px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
.scan-line {
  position: absolute; left: 16px; right: 16px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: scanMove 2.5s ease-in-out infinite; opacity: 0.75;
}
@keyframes scanMove { 0%,100%{top:16px} 50%{top:calc(100% - 18px)} }

.cam-btns { display: flex; gap: 10px; padding: 14px 16px; }
.cam-btns .btn { flex: 1; }

/* AI loading */
.ai-loading {
  display: none; padding: 20px 18px;
  border-top: 1px solid var(--border);
  text-align: center; color: var(--muted); font-size: 0.85rem;
}
.spinner {
  width: 26px; height: 26px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* AI result */
.ai-result {
  display: none; padding: 16px 18px;
  border-top: 1px solid var(--border);
  animation: fadeUp 0.35s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.ai-label { font-family: var(--fm); font-size: 0.65rem; color: var(--accent2); letter-spacing:1px; text-transform:uppercase; margin-bottom: 8px; }
.ai-food-name { font-family: var(--fd); font-size: 1.3rem; font-weight: 700; margin-bottom: 2px; }
.ai-kcal { font-family: var(--fm); font-size: 1.8rem; color: var(--accent); }
.ai-kcal small { font-size: 0.85rem; color: var(--muted); margin-left: 4px; }
.ai-macros { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.macro-chip {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px;
  font-size: 0.75rem; font-family: var(--fm);
}
.macro-chip .v { color: var(--accent2); font-weight: 500; }
.macro-chip .l { color: var(--muted); margin-left: 3px; font-size: 0.68rem; }
.ai-add-btn {
  width: 100%; margin-top: 12px; padding: 12px;
  background: rgba(198,241,53,0.08); border: 1px solid rgba(198,241,53,0.3);
  color: var(--accent); border-radius: 12px;
  font-family: var(--fb); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; min-height: 48px;
  transition: background 0.15s;
  user-select: none;
}
.ai-add-btn:active { background: rgba(198,241,53,0.18); }

/* iOS file-input fallback */
.ios-hint {
  display: none;
  font-size: 0.78rem; color: var(--muted); text-align: center;
  padding: 10px 18px; border-top: 1px solid var(--border);
  line-height: 1.5;
}
.ios-file-btn {
  display: none;
  width: calc(100% - 32px); margin: 0 16px 14px;
  padding: 13px; border-radius: 12px; min-height: 48px;
  background: var(--card); border: 1px dashed var(--border);
  color: var(--text); font-family: var(--fb); font-size: 0.88rem; font-weight: 600;
  cursor: pointer; text-align: center;
}
input[type=file]#iosFileInput { display: none; }

/* ════════════════════════════════════════════════
   TAB 2 — SEARCH & LOG
════════════════════════════════════════════════ */
.search-box {
  position: relative; margin-bottom: 10px;
}
.search-box svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.4; pointer-events:none; }
.search-input {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 14px 14px 42px;
  color: var(--text); font-family: var(--fb); font-size: 1rem;
  outline: none; transition: border-color 0.2s;
  /* Prevent iOS zoom on focus */
  font-size: 16px;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.food-dropdown {
  display: none; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; max-height: 220px; overflow-y: auto;
  margin-top: 6px;
  -webkit-overflow-scrolling: touch;
}
.food-opt {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  font-size: 0.9rem; cursor: pointer; transition: background 0.1s;
  min-height: 48px;
}
.food-opt:last-child { border-bottom: none; }
.food-opt:active { background: var(--surface); }
.food-opt-name { font-weight: 500; }
.food-opt-kcal { font-family: var(--fm); font-size: 0.8rem; color: var(--accent); }

.qty-row {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
}
.qty-lbl { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.qty-input {
  flex: 1; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 13px 14px; color: var(--text);
  font-family: var(--fm); font-size: 16px; /* prevent iOS zoom */
  outline: none; transition: border-color 0.2s; min-height: 48px;
}
.qty-input:focus { border-color: var(--accent); }
.qty-unit { font-size: 0.8rem; color: var(--muted); }
.btn-add-food {
  background: var(--accent); color: #0E0F11; border: none;
  border-radius: 12px; padding: 13px 18px;
  font-family: var(--fb); font-weight: 700; font-size: 0.88rem;
  cursor: pointer; white-space: nowrap; min-height: 48px;
  user-select: none;
}
.btn-add-food:active { background: #d4ff3d; transform: scale(0.97); }

.preview-text { font-family: var(--fm); font-size: 0.78rem; color: var(--muted); margin-top: 8px; min-height: 16px; }

/* Log */
.log-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; border-bottom: 1px solid var(--border);
}
.log-title { font-family: var(--fd); font-weight: 700; font-size: 0.9rem; }
.clear-btn { background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; font-family: var(--fb); padding: 6px; }
.log-items { padding: 0 18px; }
.log-
