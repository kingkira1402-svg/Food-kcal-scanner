<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food Kcal Calculator</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #45a049;
            --secondary: #ff9800;
            --dark: #333;
            --light: #f4f4f9;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .calorie-display {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .calorie-display h2 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .calorie-display p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 15px;
        }

        .btn-ai {
            background-color: #6200ee;
            color: white;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3);
        }

        .btn-ai:hover {
            background-color: #4f00bc;
        }

        .btn-manual {
            background-color: #e0e0e0;
            color: var(--dark);
        }

        /* Camera Modal Overlay */
        #camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 1000;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        #video {
            width: 100%;
            height: 70vh;
            object-fit: cover;
            border-radius: 15px;
        }

        .camera-controls {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .btn-capture {
            background-color: var(--white);
            color: black;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 2rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,255,255,0.3);
        }

        .btn-close-camera {
            background-color: #ff3b30;
            color: white;
            flex: 1;
        }

        /* Log / Results Section */
        .log-section {
            margin-top: 20px;
        }

        .log-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.3s ease;
        }

        .log-item .food-details {
            display: flex;
            flex-direction: column;
        }

        .log-item .food-name {
            font-weight: bold;
        }

        .log-item .food-portion {
            font-size: 0.8rem;
            color: #666;
        }

        .log-item .food-kcal {
            font-weight: bold;
            color: var(--primary-dark);
        }

        /* Loading Spinner */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>NutriScan AI</h1>
            <p>Track your food with one tap</p>
        </header>

        <div class="calorie-display">
            <p>Total Calories Today</p>
            <h2 id="total-calories">0</h2>
            <p>kcal</p>
        </div>

        <button class="btn btn-ai" id="open-camera-btn">
            📸 Camera AI Search
        </button>

        <button class="btn btn-manual" id="manual-add-btn">
            + Add Manually
        </button>

        <div class="log-section">
            <div class="log-title">Today's Food Log</div>
            <div id="food-log-list">
                </div>
        </div>
    </div>

    <div id="camera-modal">
        <video id="video" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="btn btn-close-camera" id="close-camera-btn">Cancel</button>
            <button class="btn-capture" id="capture-btn">📸</button>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">AI is analyzing your food...</p>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // API Configuration (Using your provided Gemini API Key)
        const GEMINI_API_KEY = "AQ.Ab8RN6K8ar4qWItaJnQMKgaeDCy9oAbWlTZ7LmbMqJNuqp4M6Q";
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        // Elements
        const openCameraBtn = document.getElementById('open-camera-btn');
        const closeCameraBtn = document.getElementById('close-camera-btn');
        const captureBtn = document.getElementById('capture-btn');
        const manualAddBtn = document.getElementById('manual-add-btn');
        const cameraModal = document.getElementById('camera-modal');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const loadingOverlay = document.getElementById('loading-overlay');
        const totalCaloriesEl = document.getElementById('total-calories');
        const foodLogList = document.getElementById('food-log-list');

        let totalCalories = 0;
        let stream = null;

        // Open Camera Stream
        async function startCamera() {
            try {
                // requests rear-facing camera on mobile devices automatically
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                cameraModal.style.display = 'flex';
            } catch (err) {
                alert("Could not access camera. Please check your permissions or ensure you are running over HTTPS.");
                console.error(err);
            }
        }

        // Close Camera Stream
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            cameraModal.style.display = 'none';
        }

        // Add item UI and update calculation
        function addFoodItem(name, portion, kcal) {
            totalCalories += parseInt(kcal) || 0;
            totalCaloriesEl.textContent = totalCalories;

            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <div class="food-details">
                    <span class="food-name">${name}</span>
                    <span class="food-portion">${portion}</span>
                </div>
                <div class="food-kcal">+${kcal} kcal</div>
            `;
            foodLogList.insertBefore(logItem, foodLogList.firstChild);
        }

        // Capture Picture and Call Gemini API
        async function captureAndAnalyze() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert image to Base64 (JPEG format)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            const base64Data = dataUrl.split(',')[1];

            stopCamera();
            loadingOverlay.style.display = 'flex';

            // Construct Gemini Request Body
            const prompt = "Identify the main food in this image. Estimate its standard portion size and total calories (kcal). Output ONLY raw JSON text matching this exact scheme: {\"foodName\": \"name of food\", \"portion\": \"estimated portion/weight\", \"calories\": 250}. Do not include markdown blocks like ```json.";

            const requestBody = {
                contents: [{
                    parts: [
                        { text: prompt },
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64Data
                            }
                        }
                    ]
                }]
            };

            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                // Parse AI response text
                let aiResponseText = data.candidates[0].content.parts[0].text;
                
                // Cleanup logic just in case Gemini returns markdown blocks
                aiResponseText = aiResponseText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const foodInfo = JSON.parse(aiResponseText);
                
                if (foodInfo.foodName && foodInfo.calories) {
                    addFoodItem(foodInfo.foodName, foodInfo.portion || "1 serving", foodInfo.calories);
                } else {
                    throw new Error("Invalid format received");
                }

            } catch (error) {
                console.error("API Error:", error);
                alert("Failed to analyze food. Make sure your API key is valid and you have a stable network connection.");
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        // Event Listeners
        openCameraBtn.addEventListener('click', startCamera);
        closeCameraBtn.addEventListener('click', stopCamera);
        captureBtn.addEventListener('click', captureAndAnalyze);
        
        manualAddBtn.addEventListener('click', () => {
            const name = prompt("Enter food name:");
            if (!name) return;
            const portion = prompt("Enter portion/weight (e.g., 100g, 1 plate):") || "1 serving";
            const kcal = prompt("Enter calories (kcal):");
            if (kcal && !isNaN(kcal)) {
                addFoodItem(name, portion, parseInt(kcal));
            }
        });
    </script>
</body>
</html>
